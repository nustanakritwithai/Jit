<style>
/* Layout: full-screen lineage tree (pan/zoom) under a slim header; tapping a monk opens a bottom sheet.
   Mood: forest-monastery paper, olive ink, saffron accent. Portraits sit in dark umber discs like the reference. */
:root{
  --paper:#E6E5D2; --paper-edge:#D6D4BB; --surface:#F3F1E2; --surface-2:#E9E6D0;
  --ink:#252A1D; --ink-soft:#5B5F49; --line:#B4B193;
  --accent:#A25A0A; --on-accent:#FFFFFF;
  --teal:#1F7A74; --gold:#B9811A; --bad:#B3402A; --ok:#3E7D3A;
  --pbg1:#6A5636; --pbg2:#3A2F1F;
  --ring0:#8B8870; --ringj:#2F8F86; --ringa:#C98E1C; --ringx:#F0BD3F;
  --aura:#F6D16B;
  --sch1:#3F8A4A; --sch2:#3C5FA8; --sch3:#B04A7A;
  --font-display:'Pridi','Noto Serif Thai',serif;
  --font-body:'Sarabun','Noto Sans Thai',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#161A12; --paper-edge:#0F120C; --surface:#20261A; --surface-2:#2A3122;
    --ink:#EDEAD6; --ink-soft:#A9AD94; --line:#464E39;
    --accent:#E9A640; --on-accent:#1A1408;
    --teal:#5CBDB5; --gold:#E3AD45; --bad:#E98A72; --ok:#8FCB82;
    --pbg1:#4C3C27; --pbg2:#272014;
    --ring0:#6C6E5A; --ringj:#4DB3AA; --ringa:#E2A92F; --ringx:#F7CB57; --sch1:#6FCB7F; --sch2:#7FA3EA; --sch3:#E27FB0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#161A12; --paper-edge:#0F120C; --surface:#20261A; --surface-2:#2A3122;
  --ink:#EDEAD6; --ink-soft:#A9AD94; --line:#464E39;
  --accent:#E9A640; --on-accent:#1A1408;
  --teal:#5CBDB5; --gold:#E3AD45; --bad:#E98A72; --ok:#8FCB82;
  --pbg1:#4C3C27; --pbg2:#272014;
  --ring0:#6C6E5A; --ringj:#4DB3AA; --ringa:#E2A92F; --ringx:#F7CB57; --sch1:#6FCB7F; --sch2:#7FA3EA; --sch3:#E27FB0;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--font-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{position:relative;height:100%;display:flex;flex-direction:column}

/* header + stats bands */
.band{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#top{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;padding-block:8px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;min-width:0}
.brand h1{margin:0;font:600 18px/1.2 var(--font-display);white-space:nowrap}
.brand span{white-space:nowrap;font-size:12px}
#menuBtn{padding:0 9px;white-space:nowrap;flex:none}
.seg{flex:none}
.seg button{padding:0 7px!important;min-width:34px!important}
.brand span{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2)}
.seg button{border:0;background:transparent;padding:0 9px;min-height:40px;min-width:38px;cursor:pointer;font-weight:600;font-variant-numeric:tabular-nums}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.btn{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:600;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn:disabled{opacity:.45;cursor:default}
#stats{display:flex;flex-wrap:wrap;gap:2px 18px;padding-block:7px;font-size:13px;color:var(--ink-soft);border-bottom:1px solid var(--line);background:var(--surface)}
#stats b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}

/* tree viewport */
#viewport{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;cursor:grab;
  background:radial-gradient(120% 90% at 50% 15%,var(--paper),var(--paper-edge))}
#viewport:active{cursor:grabbing}
#tree{display:block;width:100%;height:100%}
.edge{fill:none;stroke:var(--line);stroke-width:3;stroke-linecap:round}
.edge.teach{stroke:var(--ok);stroke-width:4;stroke-dasharray:8 8;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-16}}
.node{cursor:pointer;outline:none}
.node .nm,.node .stg{text-anchor:middle;paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.node .nm{font:600 12.5px var(--font-body);fill:var(--ink)}
.node .stg{font:600 10.5px var(--font-body);fill:var(--ink-soft)}
.node .ring{fill:none;stroke-width:4;stroke:var(--ring0)}
.node.sj .ring{stroke:var(--ringj)}
.node.sa .ring{stroke:var(--ringa)}
.node.sx .ring{stroke:var(--ringx);stroke-width:5}
.node .prog{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.node .selr{display:none;fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:3 5}
.node.sel .selr{display:block}
.node:focus-visible .selr{display:block}
.node .hdot{fill:var(--bad);stroke:var(--paper);stroke-width:2}
.node .fb circle.bg{fill:var(--surface);stroke:var(--ring0);stroke-width:1.5}
.node .fb .ic{fill:none;stroke:var(--ink);stroke-width:1.4;stroke-linecap:round}
.node .fb .fl{fill:var(--ink);stroke:none}
.node.away{opacity:.45}
.node.dead{opacity:.5}
.node.dead .ring{stroke-dasharray:5 4}
.node.dead .fb{display:none}
.node .headmk{fill:var(--ringx);stroke:var(--paper);stroke-width:2}
.node .schdot{stroke:var(--paper);stroke-width:2}
.sc-forest{fill:var(--sch1)}.sc-study{fill:var(--sch2)}.sc-community{fill:var(--sch3)}
.node.flash .ring{animation:ringpulse .9s ease-in-out 2}
@keyframes ringpulse{50%{stroke-width:11}}
.node.busy .ring{stroke-dasharray:none}
.ticker-wrap{position:absolute;top:10px;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:center;pointer-events:none}
#ticker{pointer-events:auto;max-width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 10px rgba(0,0,0,.12);cursor:pointer}
.zoomctl{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:56px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.zoomctl button{width:42px;height:42px;border:0;background:transparent;font-size:20px;font-weight:600;cursor:pointer}
.zoomctl button+button{border-top:1px solid var(--line)}

/* bottom sheet */
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:66%;overflow:auto;z-index:20;background:var(--surface);
  border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.2);
  padding:14px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));overscroll-behavior:contain}
.sh{display:flex;flex-direction:column;gap:16px}
.sh-head{display:flex;align-items:center;gap:12px}
.sh-id{min-width:0;flex:1}
.sh-id h2{margin:0;font:600 19px/1.3 var(--font-display)}
.sh-id p{margin:0;font-size:13px;color:var(--ink-soft)}
.x{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:24px;line-height:1;cursor:pointer}
.av{flex:none;border-radius:50%;border:3px solid var(--ring0);background:var(--pbg2)}
.av.sj{border-color:var(--ringj)}.av.sa{border-color:var(--ringa)}.av.sx{border-color:var(--ringx)}
.sec{display:flex;flex-direction:column;gap:8px;min-width:0}
.lab{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--ink-soft)}
.muted{color:var(--ink-soft);font-size:13px;margin:0}
.stg-n{font:600 20px var(--font-display)}
.prow{display:grid;grid-template-columns:74px 1fr 76px;align-items:center;gap:10px;font-size:13px}
.prow em{font-style:normal;text-align:right;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.bar{height:9px;border-radius:6px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--teal);width:0}
.bar.v>i{background:var(--gold)}
.bar.f>i{background:var(--ink-soft)}
.warn{border:1px solid var(--bad);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:2px}
.warn b{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-size:13px}
.chip.s{border-color:var(--teal)}.chip.v{border-color:var(--gold)}.chip.b{border-color:var(--ink-soft)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.row .grow{flex:1;min-width:140px}
.row .grow b{display:block}
.tag{font-size:12px;color:var(--ok);font-weight:700}
.cgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center;width:100%}
.cgrid small{display:block;font-size:11px;color:var(--ink-soft)}
.cgrid b{font-variant-numeric:tabular-nums}
.kidlist{display:flex;flex-wrap:wrap;gap:6px}
.kidlist button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px}

/* panel (ตำรา) */
#panel{position:absolute;inset:0;z-index:40;background:var(--paper);display:flex;flex-direction:column}
#panel .ph{display:flex;align-items:center;gap:10px;padding-block:8px;background:var(--surface);border-bottom:1px solid var(--line)}
#panel .ph h2{margin:0;font:600 19px var(--font-display);margin-right:auto}
#panel .tabs{padding-block:8px;overflow-x:auto}
#panel .body{flex:1;min-height:0;overflow:auto;padding-block:14px 24px;display:flex;flex-direction:column;gap:10px}
.card{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.card h3{margin:0;font:600 16px var(--font-display)}
.card p{margin:0;font-size:13px;color:var(--ink-soft)}
.lg{display:grid;grid-template-columns:64px 1fr;gap:10px;font-size:13px;border-bottom:1px dashed var(--line);padding-bottom:8px}
.lg time{color:var(--ink-soft);font-variant-numeric:tabular-nums}

/* banner */
#banner{position:absolute;inset:0;z-index:50;display:grid;place-items:center;background:rgba(10,12,8,.62);padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
#banner .bx{width:min(380px,100%);background:var(--surface);border:2px solid var(--ringx);border-radius:18px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
#banner h2{margin:0;font:600 22px/1.3 var(--font-display)}
#banner p{margin:0;color:var(--ink-soft);font-size:14px}
@media (prefers-reduced-motion:reduce){.edge.teach,.node.flash .ring{animation:none}}

function byId(id){for(var i=0;i<S.chars.length;i++)if(S.chars[i].id===id)return S.chars[i];return null}
function kidsOf(c){return S.chars.filter(function(x){return x.parent===c.id&&!x.dead})}
function teacherOf(c){var p=c.parent==null?null:byId(c.parent);while(p&&p.dead)p=p.parent==null?null:byId(p.parent);return p}
function capOf(c){return c.dead||c.stage<1?0:Math.min(4,2+c.stage)}
function livingCount(){var n=0;S.chars.forEach(function(c){if(!c.dead)n++});return n}
function memberCap(){return 6+2*S.up.kuti}
function recruitCost(){var l=livingCount(),d=S.chars.length-l;return Math.min(300,30+10*Math.max(0,l-3)+2*d)}
function tier(c){return c.stage>=8?'sx':c.stage>=5?'sa':c.stage>=1?'sj':''}
function income(){var s=0,a=0,n=0,cm=0;S.chars.forEach(function(c){if(c.dead)return;n++;s+=c.stage;if(c.stage>=8)a++;if(c.sch==='community')cm=1});return (1.5+.2*n+.1*s+1.5*a)*(cm?1.2:1)}
function rk(a,b){return a<b?a+'-'+b:b+'-'+a}
function sibs(c){return c.parent==null?[]:S.chars.filter(function(x){return x.parent===c.parent&&x.id!==c.id&&!x.dead})}
function relGet(a,b){var v=S.rel[rk(a.id,b.id)];if(v!=null)return v;return (a.parent===b.id||b.parent===a.id)?15:(a.parent!=null&&a.parent===b.parent?8:0)}
function relAdd(a,b,d){S.rel[rk(a.id,b.id)]=clamp(relGet(a,b)+d,0,100)}
function visChars(){
 if(!S.hideDead)return S.chars;
 var ok={};
 S.chars.forEach(function(c){if(!c.dead){var p=c;while(p&&!ok[p.id]){ok[p.id]=1;p=p.parent==null?null:byId(p.parent)}}});
 return S.chars.filter(function(c){return ok[c.id]});
}
function lifeOf(c){var a=age(c);return a<25?'วัยหนุ่มสาว':a<60?'วัยกลางคน':'วัยชรา'}
function sources(c){
 var tc=teacherOf(c),a=[];if(tc)a.push(tc);
 kidsOf(c).forEach(function(k){a.push(k)});
 sibs(c).forEach(function(k){a.push(k)});
 return a.filter(function(x){return !x.away});
}
function addV(c,n){if(c.stage<8)c.v=Math.min(REQ[c.stage][1],c.v+n)}

 var base=pick(NM[g]),i=2;while(used[base+' '+i])i++;return base+' '+i;
}

 while(pts>0){var k=pick(ks);if(fac[k]<9){fac[k]++;pts--}}

function newGame(){
 S={v:1,t:0,faith:25,nid:1,chars:[],cands:[],candT:0,log:[],speed:1,arahants:0,first:null,rel:{},cd:{},events:[],eid:1,evT:3,up:{kuti:0,sala:0,garden:0,library:0,infirm:0},fest:{until:0,n:0},auto:true,autoT:0,head:null,hideDead:false,herb:0,founded:{},stats:{heads:1,treks:0,pills:0},goals:{},finished:0,savedAt:0};

 try{

   S.chars.forEach(function(c){if(c.sch==null)c.sch='';if(c.pills==null)c.pills=0;if(c.calm==null)c.calm=0});
   if(!S.chars.some(function(c){return !c.dead})){S=keep;return false}

  }
 }catch(e){}

var DB=null;

 if(DB)return cb(DB);
 try{
  var r=indexedDB.open('saidhamma',1);
  r.onupgradeneeded=function(){r.result.createObjectStore('kv')};
  r.onsuccess=function(){DB=r.result;cb(DB)};
  r.onerror=function(){cb(null)};
 }catch(e){cb(null)}
}

 idbOpen(function(db){
  if(!db)return cb(null);
  try{var q=db.transaction('kv').objectStore('kv').get('save');q.onsuccess=function(){cb(q.result||null)};q.onerror=function(){cb(null)}}catch(e){cb(null)}
 });
}

/* ---------- log ---------- */
function logm(m){S.log.unshift({t:S.t,m:m});if(S.log.length>80)S.log.length=80;setTicker(m)}
function setTicker(m){$('#ticker').textContent=m}

/* ---------- simulation ---------- */
function immune(c,k){return c.stage>=8||(c.stage>=7&&(k==='kama'||k==='byapada'))||(c.stage>=5&&k==='vicikiccha')}
function learnable(c,t,tc){return tc&&!c.tech.includes(t.id)&&c.stage>=t.req-1&&tc.tech.includes(t.id)&&(!t.sch||c.sch===t.sch)}
function advance(c){
 c.stage++;c.s=0;c.v=0;flash[c.id]=performance.now()+1900;try{if(!offline&&c.stage>=5&&navigator.vibrate&&navigator.userActivation&&navigator.userActivation.hasBeenActive)navigator.vibrate(40)}catch(_){}
 var k=c.stage<=4?'sam':'pa';c.fac[k]=Math.min(10,c.fac[k]+1);
 TECH.forEach(function(t){if(t.req>=2&&!t.sch&&t.req===c.stage&&!c.tech.includes(t.id)){c.tech.push(t.id);logm(nm(c)+' เห็นแจ้ง “'+t.n+'” จากการปฏิบัติของตนเอง')}});
 S.faith+=8*c.stage;
 logm(nm(c)+(c.stage<=4?' เข้าถึง':' บรรลุ')+STAGES[c.stage].n);
 if(c.stage===8){S.arahants++;if(!S.first){S.first={name:nm(c),t:S.t,id:c.id};showBanner(c)}}
 treeDirty=true;
}
function step(dt){
 S.t+=dt;S.autoT=(S.autoT||0)+dt;if(S.auto&&S.autoT>=.25){S.autoT=0;autoTeach()}
 S.faith+=income()*dt;S.herb+=.2*(S.up.garden||0)*dt;
 for(var i=0;i<S.chars.length;i++){
  var c=S.chars[i],tc=teacherOf(c);
  if(c.dead)continue;
  if(age(c)>=c.life){if(offline){c.joined+=dt}else{die(c);continue}}
  if(c.away){
   if(S.t>=c.away.until){var tr=c.away;c.away=null;if(tr.trek){c.away=tr;resolveTrek(c);c.away=null;logm(nm(c)+' กลับจากธุดงค์')}else{addV(c,25);c.fac.sati=Math.min(10,c.fac.sati+1);S.faith+=10;logm(nm(c)+' กลับจากธุดงค์ สติมั่นคงขึ้น')}treeDirty=true}
   continue;
  }
  if(c.job&&S.t>=c.job.until){
   var d=byId(c.job.to);
   if(d&&!d.dead&&!d.tech.includes(c.job.tech)){d.tech.push(c.job.tech);relAdd(c,d,6);flash[d.id]=performance.now()+1500;logm(nm(d)+' ได้เรียน “'+T(c.job.tech).n+'” จาก'+nm(c))}
   addV(c,3);c.job=null;
  }
  var yrs=age(c);
  if(c.hind&&S.t>=c.hind.until){logm(nm(c)+' พ้นจาก'+H[c.hind.k].n+'แล้ว');c.hind=null}
  else if(!c.hind&&c.stage<8&&S.t>=(c.calm||0)){
   var p=Math.max(.03,.25*(1-(c.fac.sati+c.fac.sa)/26))*(yrs<25?1.4:yrs>=60?.7:1)*(tc&&relGet(c,tc)>=60?.7:1)*(1-.06*S.up.sala)*(c.sch==='community'?.85:1);
   if(Math.random()<p*dt){
    var k=pick(Object.keys(H));
    if(!immune(c,k)){
     if(c.tech.some(function(id){return T(id).anti===k}))c.resisted++;
     else{c.hind={k:k,until:S.t+2.5};logm(nm(c)+' ถูก'+H[k].n+'รบกวน: '+H[k].d)}
    }
   }
  }
  if(c.stage<8){
   var rq=REQ[c.stage],f=c.fac;
   var sr=3+(f.sam+f.sati)*.5,vr=2+(f.pa+f.vir)*.45,sb=1,vb=1;
   if(c.sch==='forest')sr*=1.12;if(c.sch==='study')vr*=1.12;
   vr*=1+.03*(S.up.library||0);
   c.tech.forEach(function(id){var t=T(id),bb=t.b*(t.fit&&t.fit.indexOf(c.carita)>=0?1.5:1);if(t.k==='s'||t.k==='b')sb+=bb;if(t.k==='v'||t.k==='b')vb+=bb});
   var tm=1;
   if(tc&&!tc.away)tm=(1+.06*tc.stage)*(.9+relGet(c,tc)/250);
   var sn=0;sibs(c).forEach(function(x){if(!x.away&&relGet(c,x)>=30)sn++});
   tm*=1+.03*Math.min(3,sn);
   tm*=yrs<25?1.1:yrs>=60?.9:1;
   tm*=1+.04*S.up.kuti;
   if(S.t<S.fest.until)tm*=1.25;
   var hd=S.head!=null?byId(S.head):null;if(hd&&!hd.dead)tm*=1+.01*hd.stage;
   var fs=1,fv=1,rs=rq[0]?c.s/rq[0]:1,rv=rq[1]?c.v/rq[1]:1;
   if(c.focus==='s'){fs=1.5;fv=.5}else if(c.focus==='v'){fs=.5;fv=1.5}
   else if(rs<rv){fs=1.25;fv=.75}else if(rv<rs){fs=.75;fv=1.25}
   var m=tm*(c.hind?.4:1)*(c.job?.75:1);
   c.s=Math.min(rq[0],c.s+sr*sb*fs*m*dt);
   c.v=Math.min(rq[1],c.v+vr*vb*fv*m*dt);
   if(c.s>=rq[0]&&c.v>=rq[1])advance(c);
  }
  if(tc&&!tc.away&&tc.stage>=1)relAdd(c,tc,1.2*dt);
 }
 S.candT+=dt;
 if(S.candT>=6&&$('#sheet').hidden){S.candT=0;S.cands[rnd(3)]=genCand()}
 S.events=S.events.filter(function(e){if(e.type!=='succ'&&(byId(e.a).dead||(e.b&&byId(e.b).dead)))return false;if(S.t>=e.until){evAuto(e);return false}return true});
 S.evT-=dt;
 if(!offline&&S.evT<=0&&S.events.length<4){S.evT=2.5+Math.random()*2;genEvent()}
}

/* ---------- death and succession ---------- */
function die(c){
 var par=c.stage>=8;
 c.dead={t:S.t,age:Math.floor(age(c))};
 c.job=null;c.hind=null;c.away=null;
 S.chars.forEach(function(x){if(x.job&&x.job.to===c.id)x.job=null});
 logm(nm(c)+(par?' ปรินิพพาน':' ละสังขาร')+' อายุ '+c.dead.age+' ปี');
 kidsOf(c).forEach(function(k){
  var best=null;
  TECH.forEach(function(t){if(c.tech.includes(t.id)&&!k.tech.includes(t.id)&&k.stage>=t.req-1&&(!t.sch||k.sch===t.sch)&&(!best||t.req>best.req))best=t});
  if(best){k.tech.push(best.id);flash[k.id]=performance.now()+1500;logm(nm(k)+' รับคำสอนสุดท้ายของ'+nm(c)+': “'+best.n+'”')}
 });
 S.faith+=10*(c.stage+1);
 if(par){
  S.chars.forEach(function(x){if(!x.dead)addV(x,10)});
  kidsOf(c).forEach(function(k){k.fac.sa=Math.min(10,k.fac.sa+1)});
  logm('การปรินิพพานของ'+nm(c)+'เป็นแรงบันดาลใจแก่ทั้งสาย');
 }
 treeDirty=true;lastSig='';
 if(!S.chars.some(function(x){return !x.dead})){showEnd();return}
 if(S.head===c.id)startSuccession(c);
}
function startSuccession(c){
 var cs=kidsOf(c);
 if(!cs.length)cs=S.chars.filter(function(x){return !x.dead});
 cs=cs.slice().sort(function(a,b){return b.stage-a.stage}).slice(0,4);
 S.head=null;
 if(cs.length===1){S.head=cs[0].id;S.stats.heads++;logm(nm(cs[0])+' สืบทอดเป็นหัวหน้าสาย');return}
 var e={id:S.eid++,type:'succ',a:c.id,cands:cs.map(function(x){return x.id}),t:S.t,until:S.t+4};
 S.events.push(e);logm('เหตุการณ์: '+evTitle(e));
}

/* ---------- events ---------- */
function evTitle(e){
 var a=byId(e.a),b=e.b?byId(e.b):null;
 if(e.type==='succ')return 'เลือกผู้สืบทอดสายแทน'+nm(a)+'ที่ละสังขาร';
 if(e.type==='dis')return nm(a)+' ท้อแท้ ความสนิทกับครูยังน้อย';
 if(e.type==='dsp')return nm(a)+' กับ'+nm(b)+' เห็นต่างกันเรื่องแนวปฏิบัติ';
 return 'โยมมาถวายปัจจัย ให้'+nm(a)+'เป็นผู้รับ';
}
function genEvent(){
 var cs=S.chars.filter(function(c){return !c.away&&!c.dead}),opts=[];
 var dis=cs.filter(function(c){var tc=teacherOf(c);return tc&&c.stage<=2&&relGet(c,tc)<35&&!S.events.some(function(e){return e.a===c.id})});
 if(dis.length)opts.push(function(){return {type:'dis',a:pick(dis).id}});
 var pairs=[];
 cs.forEach(function(a){sibs(a).forEach(function(b){if(a.id<b.id&&!b.away&&a.stage<8&&b.stage<8&&!S.events.some(function(e){return e.type==='dsp'&&e.a===a.id&&e.b===b.id}))pairs.push([a,b])})});
 if(pairs.length)opts.push(function(){var p=pick(pairs);return {type:'dsp',a:p[0].id,b:p[1].id}});
 if(cs.length)opts.push(function(){return {type:'don',a:pick(cs).id}});
 if(!opts.length)return;
 var e=pick(opts)();e.id=S.eid++;e.t=S.t;e.until=S.t+4;S.events.push(e);
 logm('เหตุการณ์: '+evTitle(e));
}
function evAuto(e){
 var a=byId(e.a),b=e.b?byId(e.b):null;
 if(e.type==='dis'){a.away={until:S.t+4};a.job=null;a.hind=null;logm(nm(a)+' ท้อแท้และไม่มีใครดูแล ขอออกธุดงค์ 4 ปี');treeDirty=true}
 else if(e.type==='dsp'){relAdd(a,b,-8);logm('ข้อโต้แย้งของ'+nm(a)+'กับ'+nm(b)+'ค้างคา ความสนิทลดลง')}
 else if(e.type==='succ'){
  var lv=e.cands.map(byId).filter(function(x){return x&&!x.dead});
  if(!lv.length)lv=S.chars.filter(function(x){return !x.dead});
  lv.sort(function(p,q){return q.stage-p.stage});
  if(lv.length){S.head=lv[0].id;S.stats.heads++;logm('ไม่มีการเลือก '+nm(lv[0])+' ที่ก้าวหน้าที่สุดสืบทอดเป็นหัวหน้าสาย');treeDirty=true}
 }
 else{S.faith+=15;logm('รับปัจจัยที่โยมถวายไว้ ศรัทธา +15')}
}
function evResolve(id,opt){
 var i=-1;S.events.forEach(function(e,j){if(e.id===id)i=j});if(i<0)return;
 var e=S.events[i],a=byId(e.a),b=e.b?byId(e.b):null,tc=teacherOf(a);
 if(e.type==='dis'){
  if(opt==='guide'){if(S.faith<10)return;S.faith-=10;if(tc)relAdd(a,tc,15);a.fac.sa=Math.min(10,a.fac.sa+1);logm(nm(tc||a)+' แนะนำ'+nm(a)+'อย่างใกล้ชิด ใจกลับมามั่นคง')}
  else if(Math.random()<.5){logm(nm(a)+' ใคร่ครวญแล้วตัดสินใจฝึกต่อ')}
  else{a.away={until:S.t+3};a.job=null;a.hind=null;logm(nm(a)+' ขอออกธุดงค์ 3 ปี');treeDirty=true}
 }else if(e.type==='dsp'){

function autoTeach(){
 S.chars.forEach(function(c){
  if(c.dead||c.away)return;
  sources(c).forEach(function(sr){
   if(sr.job||c.away)return;

    if(c.hind&&t.anti===c.hind.k)v+=1;

function layout(){

 visChars().forEach(function(c){var k=c.parent==null?'r':c.parent;(kids[k]=kids[k]||[]).push(c)});
 var root=S.chars.filter(function(c){return c.parent==null})[0];
 (function go(c,d){
  var ch=kids[c.id]||[];
  if(!ch.length){pos[c.id]={x:slot++*GX,y:d*GY}}
  else{ch.forEach(function(k){go(k,d+1)});var xs=ch.map(function(k){return pos[k.id].x});pos[c.id]={x:(Math.min.apply(null,xs)+Math.max.apply(null,xs))/2,y:d*GY}}
  pos[c.id].d=d;

}

var vp=$('#viewport'),world=$('#world');

function zoomAt(cx,cy,nk){

}
function fit(){
 var xs=[],ys=[];for(var id in L){xs.push(L[id].x);ys.push(L[id].y)}
 var minx=Math.min.apply(null,xs),maxx=Math.max.apply(null,xs),maxy=Math.max.apply(null,ys);
 var w=vp.clientWidth||360,h=vp.clientHeight||500,bw=maxx-minx+GX*1.1,bh=maxy+GY*.95;
 view.k=clamp(Math.min(w/bw,h/bh),.3,1.15);
 view.x=w/2-((minx+maxx)/2)*view.k;view.y=h*.5-(maxy/2)*view.k+10;applyView();
}
var tw=null;
function centerOn(id){

 var tx=w/2-p.x*view.k,ty=h*.22-p.y*view.k,sx=view.x,sy=view.y,t0=performance.now();
 cancelAnimationFrame(tw);
 (function f(now){var u=clamp((now-t0)/220,0,1);u=1-Math.pow(1-u,3);view.x=sx+(tx-sx)*u;view.y=sy+(ty-sy)*u;applyView();if(u<1)tw=requestAnimationFrame(f)})(t0);
}
var ptrs={},nP=0,drag=null,pinch=null,moved=0,downT=0;
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
vp.addEventListener('pointerdown',function(e){
 if(e.target.closest('.zoomctl,.ticker-wrap button,.quick-dock button'))return;
 try{vp.setPointerCapture(e.pointerId)}catch(_){}
 if(!ptrs[e.pointerId])nP++;ptrs[e.pointerId]={x:e.clientX,y:e.clientY};cancelAnimationFrame(tw);
 if(nP===1){drag={sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y};moved=0;downT=performance.now()}
 else if(nP===2){var a=Object.keys(ptrs).map(function(k){return ptrs[k]});pinch={d:dist(a[0],a[1]),k:view.k,cx:(a[0].x+a[1].x)/2,cy:(a[0].y+a[1].y)/2,vx:view.x,vy:view.y};moved=99;touched=true}
});
vp.addEventListener('pointermove',function(e){
 if(!ptrs[e.pointerId])return;ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
 if(nP===2&&pinch){
  var a=Object.keys(ptrs).map(function(k){return ptrs[k]}),r=vp.getBoundingClientRect(),nk=clamp(pinch.k*dist(a[0],a[1])/pinch.d,.3,2.4);
  var wx=(pinch.cx-r.left-pinch.vx)/pinch.k,wy=(pinch.cy-r.top-pinch.vy)/pinch.k,cx=(a[0].x+a[1].x)/2,cy=(a[0].y+a[1].y)/2;
  view.k=nk;view.x=cx-r.left-wx*nk;view.y=cy-r.top-wy*nk;applyView();
 }else if(drag&&nP===1){
  var dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;moved=Math.max(moved,Math.hypot(dx,dy));
  if(moved>6){touched=true;view.x=drag.vx+dx;view.y=drag.vy+dy;applyView()}
 }
});

  var el=document.elementFromPoint(e.clientX,e.clientY),nd=el&&el.closest&&el.closest('.node');

 }

 var eb=$('#expBtn');if(eb)eb.onclick=function(){
  var t=btoa(unescape(encodeURIComponent(JSON.stringify(S)))),bx=$('#saveBox'),m=$('#saveMsg');bx.value=t;bx.select();

  }catch(e){m.textContent='รหัสเซฟไม่ถูกต้อง'}
 };
 var ab=$('#atBtn');if(ab)ab.onclick=function(){S.auto=!S.auto;renderPanel()};

  if(!resetArm){resetArm=true;renderPanel();return}

$('#goHead').onclick=openHead;

/* ---------- goals ---------- */
function depthOf(c){var d=0;while(c&&c.parent!=null){c=byId(c.parent);d++}return d}
function maxDepth(){var m=0;S.chars.forEach(function(c){m=Math.max(m,depthOf(c))});return m}
var GOALS=[
 {id:'a1',n:'พระอรหันต์องค์แรก',f:function(){return S.arahants>=1},p:function(){return 'พระอรหันต์ '+S.arahants+' / 1'}},
 {id:'a3',n:'มีพระอรหันต์ 5 องค์',f:function(){return S.arahants>=5},p:function(){return 'พระอรหันต์ '+Math.min(S.arahants,5)+' / 5'}},
 {id:'g4',n:'สายสืบถึงรุ่นที่ 5',f:function(){return maxDepth()>=4},p:function(){return 'ถึงรุ่นที่ '+(maxDepth()+1)+' / 5'}},
 {id:'sc',n:'ก่อตั้งครบ 3 สำนัก',f:function(){return Object.keys(S.founded).length>=3},p:function(){return 'ตั้งแล้ว '+Object.keys(S.founded).length+' / 3'}},
 {id:'hd',n:'สืบทอดหัวหน้าสายครบ 3 ท่าน',f:function(){return S.stats.heads>=3},p:function(){return 'หัวหน้าสาย '+Math.min(S.stats.heads,3)+' / 3'}},
 {id:'tr',n:'ออกธุดงค์ครบ 5 ครั้ง',f:function(){return S.stats.treks>=5},p:function(){return 'ธุดงค์ '+Math.min(S.stats.treks,5)+' / 5'}},
 {id:'yr',n:'สายธรรมยืนยาว 250 ปี',f:function(){return S.t>=250},p:function(){return 'ผ่านไป '+Math.floor(S.t)+' / 250 ปี'}}
];
function checkGoals(){
 var all=true;
 GOALS.forEach(function(g){
  if(S.goals[g.id]==null){if(g.f()){S.goals[g.id]=S.t;logm('เป้าหมายสำเร็จ: '+g.n)}else all=false}
 });
 if(all&&!S.finished){S.finished=1;showFinish()}
}

 var b=$('#banner');
 b.innerHTML='<div class="bx"><h2 id="bnTitle">สายธรรมสมบูรณ์</h2><p>ทำเป้าหมายครบทุกข้อแล้ว ผ่านไป '+(Math.floor(S.t)+1)+' ปี มีพระอรหันต์ '+S.arahants+' องค์ เล่นต่อได้ตามสบาย</p><button class="btn pri" id="bnOk">ปฏิบัติต่อ</button></div>';

}

 b.hidden=false;$('#bnOk').onclick=function(){b.hidden=true};
}
function catchUp(){
 if(!S.savedAt)return;
 var el=Math.min((Date.now()-S.savedAt)/1000,8*3600);
 if(el<30)return;
 var yrs=Math.min(60,el*.5/YEAR),st0=0,f0=S.faith;
 S.chars.forEach(function(c){st0+=c.stage});
 offline=true;
 for(var left=yrs;left>0;left-=.25)step(Math.min(.25,left));
 offline=false;
 var st1=0;S.chars.forEach(function(c){st1+=c.stage});
 showAway(Math.round(yrs),st1-st0,Math.floor(S.faith-f0));
}

}

/* ---------- loop ---------- */
function tick(){
 var now=performance.now(),dr=Math.min((now-last)/1000,2);last=now;
 if(S.speed>0)step(dr*S.speed/YEAR);
 if(treeDirty){renderTree();if(!touched)fit()}
 updateDyn();hud();liveSheet(false);
 if(now-lastGoal>1000){lastGoal=now;checkGoals()}
 if(now-saveAt>4000){saveAt=now;save()}
}
var booted=false;
function go(o){
 if(booted)return;booted=true;
 if(!adopt(o))newGame();
 catchUp();last=performance.now();
 renderTree();syncUI();hud();updateDyn();
 requestAnimationFrame(function(){fit()});
 setInterval(tick,100);
}
idbGet(function(a){var b=lsGet(),best=(a&&b)?((a.savedAt||0)>=(b.savedAt||0)?a:b):(a||b);go(best)});
